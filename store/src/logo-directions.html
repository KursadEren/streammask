<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>StreamMask — logo yönleri</title>
<style>
  body{margin:0;padding:28px;font:14px/1.5 system-ui,sans-serif;background:#f4f4f8;color:#1a1a24}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:#666;margin:0 0 24px;font-size:13px;max-width:720px}
  .row{display:flex;align-items:flex-end;gap:22px;padding:16px 18px;border-radius:14px;margin-bottom:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .row.dark{background:#202028}
  .row.dark .meta b,.row.dark .meta span{color:#f0f0f5}
  .meta{width:168px;flex:none}
  .meta b{display:block;font-size:14px}
  .meta span{display:block;color:#666;font-size:11.5px;margin-top:2px}
  .sizes{display:flex;align-items:flex-end;gap:18px}
  .s{text-align:center}
  .s em{display:block;font-style:normal;font-size:10px;color:#999;margin-top:5px}
  .row.dark .s em{color:#888}
  .bar{display:flex;align-items:center;gap:7px;background:#2b2b33;border-radius:8px;padding:5px 9px;margin-left:auto}
  .bar .t{color:#bbb;font-size:11px}
</style></head><body>

<h1>StreamMask — logo yönleri</h1>
<p class="sub">Asıl sınav 16 piksel: tarayıcı araç çubuğunda ikon bu boyutta görünür. Her yön hem beyaz hem koyu
zeminde, sağda da araç çubuğu benzetimiyle gösteriliyor. Mevcut ikon karşılaştırma için en altta.</p>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B6CFF"/><stop offset="1" stop-color="#4F3FE0"/>
    </linearGradient>
    <linearGradient id="gw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#E8E6FF"/>
    </linearGradient>

    <!-- A: tek yıldız, ters kontrast -->
    <symbol id="A" viewBox="0 0 48 48">
      <rect width="48" height="48" rx="11" fill="url(#g)"/>
      <g stroke="#fff" stroke-width="7.5" stroke-linecap="round">
        <line x1="24" y1="10" x2="24" y2="38"/>
        <line x1="11.9" y1="17" x2="36.1" y2="31"/>
        <line x1="11.9" y1="31" x2="36.1" y2="17"/>
      </g>
    </symbol>

    <!-- A2: tek yıldız + yayın noktası -->
    <symbol id="A2" viewBox="0 0 48 48">
      <rect width="48" height="48" rx="11" fill="url(#g)"/>
      <g stroke="#fff" stroke-width="7" stroke-linecap="round">
        <line x1="22" y1="12" x2="22" y2="36"/>
        <line x1="11.6" y1="18" x2="32.4" y2="30"/>
        <line x1="11.6" y1="30" x2="32.4" y2="18"/>
      </g>
      <circle cx="38" cy="11" r="7.5" fill="url(#g)"/>
      <circle cx="38" cy="11" r="5.5" fill="#FF3B30"/>
    </symbol>

    <!-- B: üç yıldız -->
    <symbol id="B" viewBox="0 0 48 48">
      <rect width="48" height="48" rx="11" fill="url(#g)"/>
      <g stroke="#fff" stroke-width="3.6" stroke-linecap="round">
        <g transform="translate(11,24)">
          <line x1="0" y1="-7" x2="0" y2="7"/><line x1="-6.1" y1="-3.5" x2="6.1" y2="3.5"/><line x1="-6.1" y1="3.5" x2="6.1" y2="-3.5"/>
        </g>
        <g transform="translate(24,24)">
          <line x1="0" y1="-7" x2="0" y2="7"/><line x1="-6.1" y1="-3.5" x2="6.1" y2="3.5"/><line x1="-6.1" y1="3.5" x2="6.1" y2="-3.5"/>
        </g>
        <g transform="translate(37,24)">
          <line x1="0" y1="-7" x2="0" y2="7"/><line x1="-6.1" y1="-3.5" x2="6.1" y2="3.5"/><line x1="-6.1" y1="3.5" x2="6.1" y2="-3.5"/>
        </g>
      </g>
    </symbol>

    <!-- C: maske silueti -->
    <symbol id="C" viewBox="0 0 48 48">
      <rect width="48" height="48" rx="11" fill="url(#g)"/>
      <path fill="#fff" fill-rule="evenodd" d="
        M 7 18 C 15 13.5, 33 13.5, 41 18
        C 42.5 27, 37 34.5, 30.5 33.5
        C 26.5 32.9, 25 30, 24 27.5
        C 23 30, 21.5 32.9, 17.5 33.5
        C 11 34.5, 5.5 27, 7 18 Z
        M 14.6 20.2 a 4.6 4.1 0 1 0 0.01 0 Z
        M 33.4 20.2 a 4.6 4.1 0 1 0 0.01 0 Z"/>
    </symbol>

    <!-- D: kalkan korunur, kontrast tersine çevrilir -->
    <symbol id="D" viewBox="0 0 48 48">
      <rect width="48" height="48" rx="11" fill="url(#g)"/>
      <path fill="url(#gw)" fill-rule="evenodd" d="
        M 24 7 L 39 12.5 C 39 27, 33 36.5, 24 41 C 15 36.5, 9 27, 9 12.5 Z
        M 24 15.5 L 24 30.5 M 17.5 19.2 L 30.5 26.8 M 17.5 26.8 L 30.5 19.2"/>
      <g stroke="#5A4AE3" stroke-width="5.4" stroke-linecap="round">
        <line x1="24" y1="17" x2="24" y2="30"/>
        <line x1="18.4" y1="20.2" x2="29.6" y2="26.8"/>
        <line x1="18.4" y1="26.8" x2="29.6" y2="20.2"/>
      </g>
    </symbol>

    <!-- Mevcut ikon (karşılaştırma): koyu kalkan, mor zemin -->
    <symbol id="OLD" viewBox="0 0 48 48">
      <rect width="48" height="48" rx="11" fill="url(#g)"/>
      <path fill="#E8E6F5" d="M 24 8 L 38 13 C 38 27, 32 35.5, 24 40 C 16 35.5, 10 27, 10 13 Z"/>
      <path fill="#231B4D" d="M 24 11 L 35.2 15 C 35.2 26.5, 30.4 33.4, 24 37 C 17.6 33.4, 12.8 26.5, 12.8 15 Z"/>
      <g stroke="#fff" stroke-width="1.7" stroke-linecap="round">
        <g transform="translate(17.5,24)"><line x1="0" y1="-3.2" x2="0" y2="3.2"/><line x1="-2.8" y1="-1.6" x2="2.8" y2="1.6"/><line x1="-2.8" y1="1.6" x2="2.8" y2="-1.6"/></g>
        <g transform="translate(24,24)"><line x1="0" y1="-3.2" x2="0" y2="3.2"/><line x1="-2.8" y1="-1.6" x2="2.8" y2="1.6"/><line x1="-2.8" y1="1.6" x2="2.8" y2="-1.6"/></g>
        <g transform="translate(30.5,24)"><line x1="0" y1="-3.2" x2="0" y2="3.2"/><line x1="-2.8" y1="-1.6" x2="2.8" y2="1.6"/><line x1="-2.8" y1="1.6" x2="2.8" y2="-1.6"/></g>
      </g>
    </symbol>
  </defs>
</svg>

<div id="out"></div>

<script>
  const dirs = [
    ['A',  'A · Tek yıldız',        'Uzantının yaptığı işin kendisi. 16px’te okunan tek şekil.'],
    ['A2', 'A2 · Yıldız + yayın',   'Aynısı, köşede kırmızı canlı noktası. İkinci renk tanınırlık katar.'],
    ['B',  'B · Üç yıldız',         'Maskelenmiş metne benzer, ama 16px’te üç şekil birbirine girer.'],
    ['C',  'C · Maske silueti',     'İsmi doğrudan karşılar, siluet olarak en özgünü.'],
    ['D',  'D · Kalkan, ters kontrast', 'Mevcut kimlik korunur, beyaz kalkan + oyulmuş yıldız.'],
    ['OLD','Mevcut ikon',           'Karşılaştırma: koyu kalkan mor zeminde, detay 16px’te kayboluyor.']
  ];
  const sizes = [128, 48, 32, 16];
  const out = document.getElementById('out');
  for (const dark of [false, true]) {
    for (const [id, name, note] of dirs) {
      const row = document.createElement('div');
      row.className = 'row' + (dark ? ' dark' : '');
      row.innerHTML =
        `<div class="meta"><b>${name}</b><span>${note}</span></div>
         <div class="sizes">${sizes.map(s =>
           `<div class="s"><svg width="${s}" height="${s}"><use href="#${id}"/></svg><em>${s}px</em></div>`).join('')}</div>
         <div class="bar"><svg width="16" height="16"><use href="#${id}"/></svg><span class="t">araç çubuğu</span></div>`;
      out.appendChild(row);
    }
    if (!dark) {
      const h = document.createElement('p');
      h.className = 'sub';
      h.style.margin = '22px 0 10px';
      h.textContent = 'Koyu zemin (koyu temalı araç çubuğu ve mağaza kartı):';
      out.appendChild(h);
    }
  }
</script>
</body></html>
